<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="container">

  <!-- LOGIN -->
  <div class="form-container sign-in-container">
    <form id="loginForm">
      <h1>Sign In</h1>

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <p id="error" style="color:red;"></p>

    <button type="submit">
        Login
    </button>

</form>
  </div>

</div>

<script src="signin.js"></script>
</body>
</html>
